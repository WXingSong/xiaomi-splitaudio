name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;37.0.0" >/dev/null

      - name: Build routing helper (AppRoute.java -> approute.dex)
        run: sh route/build_dex.sh

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Unit tests
        run: gradle --no-daemon --console=plain testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon --console=plain assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: xiaomi-splitaudio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build release APK (unsigned)
        run: gradle --no-daemon --console=plain assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: xiaomi-splitaudio-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
